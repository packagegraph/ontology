---
name: Deploy Ontology Documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node for workflow regression tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test Pages deployment boundary
        run: |
          npm ci --prefix tests/workflows --ignore-scripts --no-audit --no-fund
          npm test --prefix tests/workflows
      - name: Setup Java for Widoco
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdflib pyshacl owlrl
      - name: Verify version consistency
        run: make check-version
      # make deploy builds the local site; only the deploy job publishes it.
      - name: Validate ontology and build documentation
        run: make deploy
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          retention-days: 7
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
